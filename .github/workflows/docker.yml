name: Docker

# Multi-arch image (amd64, arm64) → ghcr.io/umum-ai/bddb, published only from a pushed release tag.
#
#   push tag vX.Y.Z      build + push: X.Y.Z, X.Y, X, latest (latest only without a -pre suffix),
#                        sha-<short>. `X` is emitted for 0.x too (metadata-action does not skip
#                        {{major}}=0 by itself; the README only suggests an `enable=` opt-out).
#   push main, PR        build both platforms, no push, no registry login — keeps the Dockerfile
#                        honest without publishing anything.
#   workflow_dispatch    build + push whatever ref it runs on (a tag → the tags above).
#
# BEADS_VERSION comes from the mise.toml pin (scripts/check-pins.sh --print). BDDB_VERSION (label
# org.opencontainers.image.version) is the tag's version; `bddb version` inside the image prints
# package.json's version regardless, and release.yml refuses a tag that differs from it.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/umum-ai/bddb
  # Only a release tag (or a manual run) publishes.
  PUSH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' }}

jobs:
  image:
    name: build${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch') && ' + push' || '' }} (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pins agree (mise.toml, Dockerfile, version.ts, CI matrix)
        run: scripts/check-pins.sh

      - name: Versions (beads from mise.toml, bddb from the tag or package.json)
        id: v
        run: |
          echo "beads=$(scripts/check-pins.sh --print)" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/v*) bddb="$(scripts/release-check.sh --print "$GITHUB_REF_NAME")" ;;
            *) bddb="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)-dev.${GITHUB_SHA::7}" ;;
          esac
          echo "bddb=$bddb" >> "$GITHUB_OUTPUT"
          echo "BDDB_VERSION=$bddb"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags, OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=auto: set on a semver tag without a pre-release suffix, never on main.
          flavor: |
            latest=auto
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=bddb
            org.opencontainers.image.description=Kanban dashboard for beads over the bd serve HTTP API
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.v.outputs.bddb }}
            org.beads.version=${{ steps.v.outputs.beads }}

      - name: Build${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch') && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BEADS_VERSION=${{ steps.v.outputs.beads }}
            BDDB_VERSION=${{ steps.v.outputs.bddb }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
