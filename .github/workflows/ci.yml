name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: bun install --frozen-lockfile
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run gen:api:check
      - run: mise run test
      - run: actionlint

  contract:
    name: contract (beads ${{ matrix.beads-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        beads-version: ["1.3.0-rc.2"]
    env:
      # `bd init` commits the workspace files; runners have no git identity configured.
      GIT_AUTHOR_NAME: bddb-ci
      GIT_AUTHOR_EMAIL: ci@bddb.invalid
      GIT_COMMITTER_NAME: bddb-ci
      GIT_COMMITTER_EMAIL: ci@bddb.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Pin beads version from matrix
        run: mise use "github:gastownhall/beads@${{ matrix.beads-version }}"
      - run: bun install --frozen-lockfile
      - name: Toolchain versions
        run: |
          bd version
          dolt version
          git --version
      - name: No BEADS_*/BD_* variables may reach the stand
        # The stand must only ever see its own scratch dolt (scripts/stand.sh scrubs these too).
        run: |
          if env | grep -E '^(BEADS_|BD_)'; then
            echo "::error::BEADS_*/BD_* variables are set on the runner"
            exit 1
          fi
      - name: Contract tests against a real bd serve
        run: mise run contract
        timeout-minutes: 10
      - name: Upload stand logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stand-logs-${{ matrix.beads-version }}
          path: |
            .stand/**/*.log
            .stand/**/stand.env
          if-no-files-found: ignore
