name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: bun install --frozen-lockfile
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run test
      - run: actionlint

  contract:
    name: contract (beads ${{ matrix.beads-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        beads-version: ["1.3.0-rc.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Pin beads version from matrix
        run: mise use "github:gastownhall/beads@${{ matrix.beads-version }}"
      - run: bun install --frozen-lockfile
      - run: bd version
      - run: dolt version
      - run: mise run contract
