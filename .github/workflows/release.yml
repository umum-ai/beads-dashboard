name: Release

# A release happens only when a human pushes a tag `vX.Y.Z` (never on a push to main):
#
#   1. bump `version` in package.json, commit `chore(release): X.Y.Z`, push main;
#   2. git tag -a vX.Y.Z -m "bddb X.Y.Z" && git push origin vX.Y.Z
#
# The tag fires this workflow (GitHub release + single-file binaries + SHA256SUMS) and docker.yml
# (image tags X.Y.Z, X.Y, X, latest, sha-<short>) directly — no `gh workflow run` chaining.
# `verify` refuses a tag whose version differs from package.json (scripts/release-check.sh), so the
# binary and the image print the tag's version. `workflow_dispatch` with `tag` re-runs a release
# for an existing tag (assets are re-uploaded with --clobber).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: tag == package.json, pins, lint, typecheck, unit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches package.json version
        id: check
        run: |
          version="$(scripts/release-check.sh --print "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 0.x and anything with a pre-release suffix (-rc.1, -beta) is a GitHub pre-release.
          case "$version" in
            0.*|*-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: scripts/check-pins.sh
      - run: bun install --frozen-lockfile
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run test

  binaries:
    name: binary ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `bun build --compile --target` cross-compiles from one runner (downloads the target runtime).
        target: [bun-linux-x64, bun-linux-arm64, bun-darwin-x64, bun-darwin-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: bun install --frozen-lockfile
      - name: Build
        run: scripts/build-binary.sh --target "${{ matrix.target }}"
      - name: Package (bddb-<version>-<os>-<arch>.tar.gz + .sha256)
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          name="bddb-${TARGET#bun-}"
          asset="bddb-${VERSION}-${TARGET#bun-}.tar.gz"
          mkdir -p assets
          tar -C dist -czf "assets/$asset" "$name"
          (cd assets && sha256sum "$asset" > "$asset.sha256")
          case "$TARGET" in
            bun-linux-x64) printed="$("./dist/$name" version)" ;;
            *) printed="bddb $VERSION (cross-compiled; not run)" ;;
          esac
          echo "$printed"
          case "$printed" in
            "bddb $VERSION "*) ;;
            *) echo "::error::binary prints '$printed', expected 'bddb $VERSION …'"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: assets/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release ${{ needs.verify.outputs.version }}
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: assets
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -la
      - name: Create the release (or upload into the existing one)
        working-directory: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "release $TAG exists — replacing assets"
            gh release upload "$TAG" -R "$REPO" --clobber ./*.tar.gz ./*.sha256 SHA256SUMS
          else
            flags=(--title "bddb $VERSION" --generate-notes --verify-tag)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" -R "$REPO" "${flags[@]}" ./*.tar.gz ./*.sha256 SHA256SUMS
          fi
          gh release view "$TAG" -R "$REPO"
