# Toolchain and task runner for bddb. See AGENTS.md for the workflow.
[tools]
bun = "1.4"
"github:gastownhall/beads" = "1.3.0-rc.2"
"aqua:dolthub/dolt" = "2.3"
biome = "2"
actionlint = "1.7.7"
hadolint = "2.15.1"

[tasks.dev]
description = "Start the local stand if needed, then run the BFF with hot reload against it"
run = "scripts/dev.sh"

[tasks.doctor]
description = "bddb doctor against the local stand (dolt 3399)"
run = "bun src/server/cli.ts doctor --dolt-host 127.0.0.1 --dolt-port 3399"

[tasks.lint]
description = "Biome check (format + lint), read-only"
run = "biome check ."

[tasks."lint:fix"]
description = "Biome check with safe fixes applied"
run = "biome check --write ."

[tasks.typecheck]
description = "TypeScript type check without emit"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Unit tests"
run = "bun test tests/unit"

[tasks.contract]
description = "Contract tests against a real bd serve (starts a scratch dolt + bd serve via scripts/stand.sh)"
run = "bun test tests/contract"

[tasks."gen:api"]
description = "Regenerate src/api-client/generated/openapi.d.ts from spec/openapi.v0.yaml"
run = "scripts/gen-api.sh"

[tasks."gen:api:check"]
description = "Fail when the generated API types are stale"
run = "scripts/gen-api.sh --check"

[tasks."dev:mock"]
description = "Serve the SPA on a mock BFF with an in-memory fixture (http://127.0.0.1:7331)"
run = "bun src/web/dev/mock-bff.ts"

[tasks.e2e]
description = "Playwright e2e; E2E_TARGET=mock (default) starts the mock BFF, otherwise uses BDDB_URL"
run = "bunx playwright test"

[tasks."build:web"]
description = "Production build of the SPA into dist/web (relative asset URLs; serve with BDDB_WEB_DIR)"
run = "scripts/build-web.sh"

[tasks."build:server"]
description = "Self-contained server bundle (SPA included) into dist/server: bun dist/server/cli.js serve"
run = "scripts/build-server.sh"

[tasks.build]
description = "build:web + build:server"
depends = ["build:web", "build:server"]

[tasks."build:binary"]
description = "Single executable dist/bddb-<os>-<arch> (bun build --compile); --target bun-linux-x64|bun-linux-arm64|bun-darwin-x64|bun-darwin-arm64"
run = "scripts/build-binary.sh"

[tasks."check:pins"]
description = "mise.toml, Dockerfile, version.ts and the CI matrix agree on the beads version"
run = "scripts/check-pins.sh"

[tasks."docker:build"]
description = "Build the container image with BEADS_VERSION from mise.toml"
run = 'docker build --build-arg "BEADS_VERSION=$(scripts/check-pins.sh --print)" -t bddb .'

[tasks."docker:lint"]
description = "hadolint Dockerfile"
run = "hadolint Dockerfile"

[tasks."docker:smoke"]
description = "Build the image and run it against a scratch stand (scripts/docker-smoke.sh)"
run = "scripts/docker-smoke.sh"
